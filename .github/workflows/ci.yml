name: CI

on:
  push:
    branches: [ main, "copilot/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          pip install requests urllib3 certifi charset-normalizer idna \
                      rich pyfiglet asciimatics psutil pandas numpy \
                      pillow six python-dateutil pytz tzdata \
                      watchdog wcwidth darkdetect markdown-it-py mdurl \
                      setuptools

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on other issues but don't fail
          flake8 tests/ --count --exit-zero --max-line-length=120 --statistics

      - name: Run tests
        run: python -m pytest tests/ -v
